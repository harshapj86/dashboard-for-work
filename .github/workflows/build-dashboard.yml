name: Rebuild and deploy dashboard

# Runs automatically whenever the master Excel file changes, and can also
# be triggered manually from the Actions tab (Run workflow button).
on:
  push:
    branches: [main]
    paths:
      - 'data/For_AI_Dashboard_.xlsx'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Rebuild and deploy dashboard

# Runs automatically whenever the master Excel
